services:
  db:
    image: postgres:17
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api: 
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build: ./web
    depends_on:
      - api
    ports: ["5173:80"]
  mobile:
    build: ./mobile
    depends_on:
      - api
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_UNSTABLE_HEADLESS: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    ports: ["8081:8081"]
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true
volumes:
  pgdata:
  mobile_node_modules:
