services:
  db:
    image: postgres:17
    env_file: .env
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["127.0.0.1:8025:8025"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST-mailpit}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes: ["./backend:/app"]
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build:
      context: ./web
      target: development
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
  mobile:
    build: ./mobile
    depends_on:
      - api
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_UNSTABLE_HEADLESS: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    ports: ["8081:8081"]
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true
volumes:
  pgdata:
  web_node_modules:
  mobile_node_modules:
