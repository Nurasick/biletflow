name: CI pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
      SECRET_KEY: "ci-not-a-real-secret"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . 

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest 

      - name: Extract OpenAPI spec
        run: uv run python scripts/export_openapi.py

      - name: Verify OpenAPI spec has been updated
        run: git diff --exit-code docs/openapi.json openapi.json



  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t biletflow-api ./backend

